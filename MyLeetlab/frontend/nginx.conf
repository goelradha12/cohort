server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed static assets produced by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes (e.g. /problem/:id, /leaderboard) resolve
    # to index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
