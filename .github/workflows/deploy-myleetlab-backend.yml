name: Deploy MyLeetlab Backend to Azure

on:
  push:
    branches: [main]
    paths:
      - "MyLeetlab/backend/**"
      - ".github/workflows/deploy-myleetlab-backend.yml"

  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: cook-the-code-backend
  IMAGE_NAME: ghcr.io/${{ github.repository }}/myleetlab-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: MyLeetlab/backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE_NAME }}:${{ github.sha }}